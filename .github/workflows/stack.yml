name: stack

# Phase 1 proof: spin up a throwaway kind cluster on the GitHub runner,
# install the forever-free open-source stack with Helm, print proof,
# then scan the deployed images and this repo with Trivy.
# Nothing here touches any production system. Public repo = free minutes.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/stack.yml"
      - "k8s/**"

permissions:
  contents: read

jobs:
  stack-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create kind cluster (3 nodes)
        uses: helm/kind-action@v1
        with:
          cluster_name: stack
          config: k8s/kind-config.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Show cluster
        run: |
          kubectl cluster-info
          kubectl get nodes -o wide

      # 2026-10-24: official MinIO images cannot be pulled anonymously
      # anywhere (quay.io: 401/503 for every tag; docker.io/minio/minio:
      # repository deleted). Build both images here from MinIO's official
      # GitHub release binaries (same versions as the chart defaults,
      # sha256-verified) and load them into kind. values-minio.yaml pins
      # pullPolicy: Never for both, so pods never touch a registry.
      # No new accounts, no secrets. This step must stay BEFORE the
      # MinIO helm install step.
      - name: Build MinIO images locally (quay.io + Docker Hub unusable)
        run: |
          set -euo pipefail
          cd k8s/minio-images
          curl -sSfLO "https://github.com/minio/minio/releases/download/RELEASE.2024-12-18T13-15-44Z/minio.linux-amd64.RELEASE.2024-12-18T13-15-44Z"
          curl -sSfLO "https://github.com/minio/minio/releases/download/RELEASE.2024-12-18T13-15-44Z/minio.linux-amd64.RELEASE.2024-12-18T13-15-44Z.sha256sum"
          curl -sSfLO "https://github.com/minio/mc/releases/download/RELEASE.2024-11-21T17-21-54Z/mc.linux-amd64.RELEASE.2024-11-21T17-21-54Z"
          curl -sSfLO "https://github.com/minio/mc/releases/download/RELEASE.2024-11-21T17-21-54Z/mc.linux-amd64.RELEASE.2024-11-21T17-21-54Z.sha256sum"
          # NOTE (run #7 lesson): MinIO's .sha256sum files list the binary
          # under a SHORT name (minio.RELEASE... / mc.RELEASE...), not the
          # downloaded linux-amd64 filename — so plain `sha256sum -c`
          # fails with "No such file". Compare hashes directly instead;
          # this works whatever filename the checksum file lists.
          EXPECTED_MINIO=$(awk '{print $1}' minio.linux-amd64.RELEASE.2024-12-18T13-15-44Z.sha256sum)
          ACTUAL_MINIO=$(sha256sum minio.linux-amd64.RELEASE.2024-12-18T13-15-44Z | awk '{print $1}')
          [ "$EXPECTED_MINIO" = "$ACTUAL_MINIO" ] || { echo "minio sha256 MISMATCH"; exit 1; }
          echo "minio sha256 OK"
          EXPECTED_MC=$(awk '{print $1}' mc.linux-amd64.RELEASE.2024-11-21T17-21-54Z.sha256sum)
          ACTUAL_MC=$(sha256sum mc.linux-amd64.RELEASE.2024-11-21T17-21-54Z | awk '{print $1}')
          [ "$EXPECTED_MC" = "$ACTUAL_MC" ] || { echo "mc sha256 MISMATCH"; exit 1; }
          echo "mc sha256 OK"
          mv minio.linux-amd64.RELEASE.2024-12-18T13-15-44Z minio
          mv mc.linux-amd64.RELEASE.2024-11-21T17-21-54Z mc
          docker build -f Dockerfile.minio -t local/minio:demo .
          docker build -f Dockerfile.mc -t local/mc:demo .
          if ! command -v kind >/dev/null 2>&1; then
            echo "kind not on PATH, installing it"
            curl -sSfLO "https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64"
            chmod +x kind-linux-amd64
            sudo mv kind-linux-amd64 /usr/local/bin/kind
          fi
          kind load docker-image local/minio:demo local/mc:demo --name stack
          docker images | grep -E "local/(minio|mc)"

      - name: Add Helm repos (all open source)
        run: |
          helm repo add minio https://charts.min.io/
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

      - name: Install MinIO Community (object storage)
        run: |
          kubectl create namespace storage
          helm install minio minio/minio \
            --namespace storage \
            --values k8s/values-minio.yaml \
            --wait --timeout 10m

      # Diagnostic run: if the MinIO install fails, capture WHY before
      # the cluster is torn down. This step runs ONLY on failure, so a
      # green run is unaffected. No blind reruns without these logs.
      - name: DIAGNOSTICS — MinIO failure dump (failure only)
        if: failure()
        run: |
          echo "===== pods all namespaces ====="
          kubectl get pods -A -o wide || true
          echo "===== storage: describe deployment ====="
          kubectl describe deployment minio -n storage || true
          echo "===== storage: describe pods ====="
          kubectl describe pods -n storage || true
          echo "===== storage: events (oldest to newest) ====="
          kubectl get events -n storage --sort-by=.lastTimestamp || true
          echo "===== storage: PVCs ====="
          kubectl get pvc -n storage -o wide || true
          echo "===== minio pod logs (current + previous) ====="
          kubectl logs -n storage -l app=minio --tail=200 || true
          kubectl logs -n storage -l app=minio --tail=200 --previous || true
          echo "===== post-install job (mc) logs — run #8 lesson: the server can be healthy while this job fails ====="
          kubectl describe job minio-post-job -n storage || true
          kubectl logs -n storage -l app=minio-job --tail=200 || true
          kubectl logs -n storage job/minio-post-job --tail=200 || true
          echo "===== helm status ====="
          helm status minio -n storage || true

      - name: Install kube-prometheus-stack (Prometheus + Grafana OSS)
        run: |
          kubectl create namespace monitoring
          helm install monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values k8s/values-monitoring.yaml \
            --wait --timeout 20m

      - name: Proof — pods and services in all namespaces
        run: |
          kubectl get pods -A -o wide
          echo "----- services -----"
          kubectl get svc -A

      - name: Collect deployed container images
        run: |
          kubectl get pods -A \
            -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' \
            | sort -u | tee images.txt
          echo "----- images to scan -----"
          cat images.txt

      - name: Install Trivy CLI
        run: |
          TRIVY_VER="0.76.1"
          curl -sSfLO "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VER}/trivy_${TRIVY_VER}_Linux-64bit.tar.gz"
          tar -xzf "trivy_${TRIVY_VER}_Linux-64bit.tar.gz" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy config scan of this repo
        run: trivy config --severity HIGH,CRITICAL --exit-code 0 .

      - name: Render Helm charts and Trivy config scan the rendered manifests
        run: |
          mkdir -p rendered
          helm template minio minio/minio \
            --namespace storage \
            --values k8s/values-minio.yaml > rendered/minio.yaml
          helm template monitoring prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --values k8s/values-monitoring.yaml > rendered/monitoring.yaml
          trivy config --severity HIGH,CRITICAL --exit-code 0 rendered/

      - name: Trivy image scan of deployed images (includes MinIO + Grafana)
        run: |
          while read -r img; do
            [ -z "$img" ] && continue
            echo "===== scanning $img ====="
            trivy image --severity HIGH,CRITICAL --exit-code 0 "$img"
          done < images.txt

      # ----- Benchmark stage (migration gate evidence) -----
      # Load goes ONLY against the generic demo service inside this
      # throwaway cluster. Nothing external is touched.
      - name: Install metrics-server (needed for HPA)
        run: |
          kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
          kubectl patch deployment metrics-server -n kube-system --type=json \
            -p='[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--kubelet-insecure-tls"}]'
          kubectl wait --for=condition=available deployment/metrics-server \
            -n kube-system --timeout=240s
          kubectl top nodes || true

      - name: Deploy generic demo service (+ HPA)
        run: |
          kubectl apply -f k8s/demo-service.yaml
          kubectl rollout status deployment/demo -n demo --timeout=240s
          kubectl get pods -n demo -o wide

      - name: Run k6 load test inside the cluster (ramp to 1,000 VUs)
        run: |
          kubectl create configmap k6-load -n demo --from-file=load.js=k6/load.js
          kubectl apply -f k6/k6-job.yaml
          if kubectl wait --for=condition=complete job/k6-load -n demo --timeout=1200s; then
            echo "K6_JOB_RESULT=complete"
          else
            echo "K6_JOB_RESULT=failed-or-timeout"
          fi
          echo "----- k6 output (requests, error rate, p50/p95/p99) -----"
          kubectl logs job/k6-load -n demo
          echo "----- HPA + pods after load -----"
          kubectl get hpa -n demo
          kubectl get pods -n demo -o wide
          kubectl top pods -n demo || true
          # Surface the gate honestly: a failed k6 job fails this step.
          kubectl wait --for=condition=complete job/k6-load -n demo --timeout=5s

      # Run #12 lesson: a diagnostics step placed mid-job is SKIPPED for
      # failures that happen AFTER it (its if: failure() was already
      # false at that point). This FINAL dump sits at the end, so it
      # runs on ANY earlier failure — MinIO, monitoring, demo, or k6 —
      # and leaves evidence before the cluster is torn down.
      - name: DIAGNOSTICS — final failure dump (failure only)
        if: failure()
        run: |
          echo "===== pods all namespaces ====="
          kubectl get pods -A -o wide || true
          echo "===== storage: describe + logs ====="
          kubectl describe pods -n storage || true
          kubectl logs -n storage -l app=minio --tail=200 || true
          kubectl describe job minio-post-job -n storage || true
          kubectl logs -n storage job/minio-post-job --tail=200 || true
          echo "===== monitoring: describe + logs ====="
          kubectl describe deployments -n monitoring || true
          kubectl describe pods -n monitoring || true
          kubectl logs -n monitoring -l app.kubernetes.io/name=grafana --all-containers=true --tail=200 || true
          kubectl logs -n monitoring -l app.kubernetes.io/name=grafana --all-containers=true --tail=200 --previous || true
          echo "===== demo: describe + logs + events ====="
          kubectl describe deployment demo -n demo || true
          kubectl describe pods -n demo || true
          kubectl logs -n demo -l app=demo --tail=200 || true
          kubectl logs -n demo -l app=demo --tail=200 --previous || true
          kubectl get events -n demo --sort-by=.lastTimestamp || true
          echo "===== helm status ====="
          helm status minio -n storage || true
          helm status monitoring -n monitoring || true
