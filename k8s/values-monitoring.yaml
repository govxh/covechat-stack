# kube-prometheus-stack — Prometheus + Grafana OSS, small demo sizing.
# Chart: https://prometheus-community.github.io/helm-charts
# (chart "prometheus-community/kube-prometheus-stack"), open source.
#
# !!! DEMO PLACEHOLDER ONLY !!!
# grafana.adminPassword below is a throwaway demo password for a local
# kind cluster that is deleted after the run. It is NOT a real credential.

grafana:
  adminPassword: "admin" # DEMO PLACEHOLDER — not a real secret
  persistence:
    enabled: false
  service:
    type: ClusterIP
  # FIX 2026-10-24 (run #11 diagnostics proof): Grafana 13.2.4 was
  # OOMKilled (exit 137, CrashLoopBackOff x6) under the old 256Mi limit
  # — it starts, migrates DB, loads 51 plugins, then the kernel kills it
  # (GOMEMLIMIT was 230MiB). Sidecars, image pull, scheduling and
  # Prometheus were all fine. 512Mi gives startup headroom; the chart
  # recomputes GOMEMLIMIT from the limit automatically.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

prometheus:
  prometheusSpec:
    retention: 1d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi

# Alertmanager is not needed for this proof; keep the footprint small.
alertmanager:
  enabled: false

kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
