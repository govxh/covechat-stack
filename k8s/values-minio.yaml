# MinIO Community edition — standalone demo values for a kind cluster.
# Chart: https://charts.min.io/ (chart "minio/minio"), open source (AGPLv3).
#
# !!! DEMO PLACEHOLDERS ONLY !!!
# rootUser / rootPassword below are the well-known public demo defaults
# for a throwaway local cluster. They are NOT real credentials and must
# never be used for anything reachable by anyone else.

# FIX 2026-10-24 (diagnostic + registry proof, both runs):
#  - quay.io/minio/minio AND quay.io/minio/mc refuse ALL anonymous pulls
#    (tested every tag incl. latest with a valid anonymous token: 401,
#    and 503 on the token endpoint) — NOT a missing-tag problem.
#  - docker.io/minio/minio is DELETED ("object not found") — the Docker
#    Hub switch failed with "repository does not exist".
# So BOTH images are built inside the workflow run from MinIO's official
# GitHub release binaries (same versions as the chart defaults) and
# loaded into kind (see k8s/minio-images/ + the "Build MinIO images
# locally" workflow step). pullPolicy: Never — pods never touch a
# registry. No new accounts, no secrets.
image:
  repository: "local/minio"
  tag: "demo"
  pullPolicy: Never

mcImage:
  repository: "local/mc"
  tag: "demo"
  pullPolicy: Never

mode: standalone
replicas: 1

rootUser: "minioadmin"     # DEMO PLACEHOLDER — not a real secret
rootPassword: "minioadmin" # DEMO PLACEHOLDER — not a real secret

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Hardening (demo cluster): non-root, no privilege escalation, drop all
# capabilities. NOTE: readOnlyRootFilesystem stays FALSE (the chart's own
# default) — chart 5.4.0 mounts /tmp/credentials read-only and no writable
# /tmp, so true stalls MinIO startup (run 3: deployment never became ready).
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP

consoleService:
  type: ClusterIP
