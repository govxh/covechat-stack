# MinIO Community edition — standalone demo values for a kind cluster.
# Chart: https://charts.min.io/ (chart "minio/minio"), open source (AGPLv3).
#
# !!! DEMO PLACEHOLDERS ONLY !!!
# rootUser / rootPassword below are the well-known public demo defaults
# for a throwaway local cluster. They are NOT real credentials and must
# never be used for anything reachable by anyone else.

# FIX 2026-10-24 (diagnostic run proof): the chart's default image
# quay.io/minio/minio:RELEASE.2024-12-18T13-15-44Z could NOT be pulled
# on GitHub runners — quay.io returned 503 Service Unavailable and 401
# UNAUTHORIZED on its anonymous token endpoint (pod stuck ImagePullBackOff,
# cluster/scheduling/storage all healthy). Same image on Docker Hub avoids
# quay.io entirely. No other change.
image:
  repository: "minio/minio"
  tag: "RELEASE.2024-12-18T13-15-44Z"
  pullPolicy: IfNotPresent

mode: standalone
replicas: 1

rootUser: "minioadmin"     # DEMO PLACEHOLDER — not a real secret
rootPassword: "minioadmin" # DEMO PLACEHOLDER — not a real secret

persistence:
  enabled: true
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Hardening (demo cluster): non-root, no privilege escalation, drop all
# capabilities. NOTE: readOnlyRootFilesystem stays FALSE (the chart's own
# default) — chart 5.4.0 mounts /tmp/credentials read-only and no writable
# /tmp, so true stalls MinIO startup (run 3: deployment never became ready).
securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP

consoleService:
  type: ClusterIP
